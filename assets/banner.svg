<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0a1020"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Ambient Glows -->
    <radialGradient id="cyanGlow" cx="15%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="85%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <!-- Accent Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Technical Grid Pattern -->
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25"/>
      <circle cx="28" cy="0" r="1" fill="#38bdf8" fill-opacity="0.25"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 34px; font-weight: 800; fill: url(#textGrad); letter-spacing: -0.5px; }
    .role { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 600; fill: #38bdf8; letter-spacing: 0.5px; }
    .tagline { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13.5px; font-weight: 400; fill: #94a3b8; }
    .badge-text { font-family: 'SF Mono', Consolas, Monaco, monospace; font-size: 10px; font-weight: 700; fill: #38bdf8; letter-spacing: 1.2px; }
    .chip-text { font-family: 'SF Mono', Consolas, Monaco, monospace; font-size: 11px; font-weight: 500; fill: #cbd5e1; }
    .status-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #34d399; }
    .node-label { font-family: 'SF Mono', Consolas, Monaco, monospace; font-size: 8.5px; fill: #64748b; font-weight: 600; }
  </style>

  <!-- Canvas Base -->
  <rect width="920" height="280" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Background Grid -->
  <rect width="920" height="280" rx="16" fill="url(#grid)"/>

  <!-- Radial Glow Accents -->
  <rect width="920" height="280" rx="16" fill="url(#cyanGlow)"/>
  <rect width="920" height="280" rx="16" fill="url(#blueGlow)"/>

  <!-- Top Decorative Ambient Line -->
  <path d="M 0 0 L 920 0" stroke="url(#cyanBlueGrad)" stroke-width="3" stroke-opacity="0.8" rx="16"/>

  <!-- ================= RIGHT SIDE: INFRASTRUCTURE TOPOLOGY GRAPH ================= -->
  <g transform="translate(630, 25)" opacity="0.95">
    <!-- Subtitle Card Background -->
    <rect x="-10" y="5" width="280" height="225" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" stroke-opacity="0.6"/>

    <text x="130" y="28" text-anchor="middle" font-family="'SF Mono', monospace" font-size="9" fill="#0284c7" font-weight="700" letter-spacing="1">CLOUD ARCHITECTURE FABRIC</text>

    <!-- Connective Traces / Pipelines -->
    <path d="M 30 75 L 85 75 L 85 115 L 140 115" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="3 3"/>
    <path d="M 140 115 L 195 115 L 195 75 L 240 75" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="3 3"/>
    <path d="M 85 115 L 85 160 L 140 160" fill="none" stroke="#334155" stroke-width="1.5"/>
    <path d="M 140 160 L 195 160 L 195 115" fill="none" stroke="#334155" stroke-width="1.5"/>
    <path d="M 140 115 L 140 160" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.8"/>

    <!-- Active Telemetry Stream (Electric Blue Glow) -->
    <path d="M 30 75 Q 85 45 140 115 T 240 75" fill="none" stroke="url(#cyanBlueGrad)" stroke-width="1.5" stroke-opacity="0.7"/>

    <!-- Cluster Nodes -->
    <!-- Node 1: Code / CI -->
    <g transform="translate(30, 75)">
      <circle r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <circle r="5" fill="#38bdf8" filter="url(#softGlow)"/>
      <text x="0" y="28" text-anchor="middle" class="node-label">CI/CD</text>
    </g>

    <!-- Node 2: K8s / Runtime -->
    <g transform="translate(140, 115)">
      <circle r="22" fill="#0f172a" stroke="#60a5fa" stroke-width="2"/>
      <circle r="15" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
      <path d="M -7 -2 L 0 -9 L 7 -2 L 4 7 L -4 7 Z" fill="#38bdf8"/>
      <text x="0" y="34" text-anchor="middle" class="node-label" fill="#38bdf8">EKS / K8S</text>
    </g>

    <!-- Node 3: GitOps Argo -->
    <g transform="translate(140, 165)">
      <circle r="15" fill="#0f172a" stroke="#f97316" stroke-width="1.2" stroke-opacity="0.8"/>
      <circle r="4" fill="#f97316"/>
      <text x="0" y="26" text-anchor="middle" class="node-label">GITOPS</text>
    </g>

    <!-- Node 4: Observability (LGTM) -->
    <g transform="translate(240, 75)">
      <circle r="16" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
      <circle r="5" fill="#22d3ee" filter="url(#softGlow)"/>
      <text x="0" y="28" text-anchor="middle" class="node-label">TELEMETRY</text>
    </g>

    <!-- Metric Sparklines on bottom of card -->
    <g transform="translate(20, 205)" opacity="0.85">
      <path d="M 0 5 Q 25 -5, 50 8 T 100 0 T 150 7 T 200 -2 T 225 3" fill="none" stroke="#34d399" stroke-width="1.5"/>
      <circle cx="225" cy="3" r="2.5" fill="#34d399"/>
      <text x="0" y="-8" font-family="'SF Mono', monospace" font-size="8" fill="#64748b">HEALTH: 99.99% · LATENCY: 12ms</text>
    </g>
  </g>

  <!-- ================= LEFT SIDE: HERO IDENTITY & BIO ================= -->
  <g transform="translate(48, 40)">
    <!-- Category Badge -->
    <g>
      <rect x="0" y="0" width="220" height="26" rx="13" fill="url(#pillGrad)" stroke="#0284c7" stroke-width="1" stroke-opacity="0.6"/>
      <circle cx="14" cy="13" r="3.5" fill="#38bdf8" filter="url(#softGlow)"/>
      <text x="26" y="17" class="badge-text">CLOUD-NATIVE &amp; DEVSECOPS</text>
    </g>

    <!-- Name Heading -->
    <text x="0" y="65" class="title">Ahmed Abdelaziz</text>

    <!-- Professional Title -->
    <g transform="translate(0, 88)">
      <text x="0" y="6" class="role">DevOps Engineer</text>
      <text x="145" y="6" font-family="-apple-system, sans-serif" font-size="14" fill="#64748b">|</text>
      <text x="160" y="6" font-family="-apple-system, sans-serif" font-size="14" font-weight="500" fill="#94a3b8">Backend &amp; Distributed Systems</text>
    </g>

    <!-- Tagline -->
    <text x="0" y="124" class="tagline">Building Reliable Infrastructure, Automating Delivery, and Engineering Cloud-Native Systems.</text>

    <!-- Location & Remote Indicator -->
    <g transform="translate(0, 148)">
      <circle cx="5" cy="4" r="3.5" fill="#10b981"/>
      <circle cx="5" cy="4" r="7" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.4"/>
      <text x="18" y="8" class="status-text">Available for Remote Roles &amp; Engineering Challenges</text>
    </g>

    <!-- Core Tech Stack Chips -->
    <g transform="translate(0, 182)">
      <!-- Chip 1 -->
      <g transform="translate(0, 0)">
        <rect width="98" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="49" y="17" text-anchor="middle" class="chip-text">AWS · EKS</text>
      </g>
      <!-- Chip 2 -->
      <g transform="translate(106, 0)">
        <rect width="124" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="62" y="17" text-anchor="middle" class="chip-text">Terraform (IaC)</text>
      </g>
      <!-- Chip 3 -->
      <g transform="translate(238, 0)">
        <rect width="118" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="59" y="17" text-anchor="middle" class="chip-text">GitOps · ArgoCD</text>
      </g>
      <!-- Chip 4 -->
      <g transform="translate(364, 0)">
        <rect width="124" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="62" y="17" text-anchor="middle" class="chip-text">LGTM Stack (O11y)</text>
      </g>
      <!-- Chip 5 -->
      <g transform="translate(496, 0)">
        <rect width="90" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="45" y="17" text-anchor="middle" class="chip-text">Go · Python</text>
      </g>
    </g>
  </g>
</svg>